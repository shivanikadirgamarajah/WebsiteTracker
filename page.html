<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Time Tracker</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f7fb;
      color: #1f2937;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(600px, calc(100% - 40px));
      padding: 40px;
      border-radius: 12px;
      background: white;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      margin-top: 0;
    }

    p {
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>Website Time Tracker</h1>
    <p>Your extension tracks time spent listening to Brain.fm and stores the total session time locally.</p>
    <p>This page is part of the extension and can be opened from the popup.</p>
  </main>
</body>
</html>
